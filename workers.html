<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workers - Servly</title>
  <link rel="icon" href="favicon.ico">

  <!-- Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<!-- 🔹 HEADER -->
<header class="navbar">
  <div class="nav-left">
    <a href="home.html" class="logo">
      <img src="assets/images/logo.png" alt="Servly Logo">
      <span>Servly</span>
    </a>
  </div>

  <div class="nav-right">
    <button class="nav-btn secondary" onclick="goToHome()">Home</button>
    <button id="profileBtn" class="nav-btn secondary" style="display:none;">Profile</button>
    <button id="authBtn" class="nav-btn primary" onclick="logout()">Logout</button>
  </div>
</header>

<!-- 🔹 MAIN CONTAINER -->
<div class="container">

  <h2>Service Providers</h2>

  <!-- 🔍 SEARCH + FILTER -->
  <div class="card" style="margin-bottom:20px;">

    <input type="text" id="search" placeholder="Search service (e.g. electrician)">
    <input type="text" id="cityFilter" placeholder="Enter city">

    <button class="primary" onclick="filterWorkers()">Search</button>
    <button class="secondary" onclick="filterByCity()">Filter City</button>

  </div>

  <div class="card" style="margin-bottom:20px;"></div>

  <!-- 🔹 SUBCATEGORY SECTION -->
<div id="subcategorySection" class="card" style="margin-bottom:20px; display:none;">
  <h3>Select Service Type</h3>
  <div id="subcategoryList" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
</div>



  <!-- 🔥 WORKERS LIST -->
  <div id="workersList" class="workers-grid"></div>

</div>

<!-- SCRIPTS -->
<script type="module" src="js/workers.js"></script>
<script type="module" src="js/global.js"></script>

</body>
</html>
