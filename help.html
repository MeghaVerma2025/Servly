<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help - Servly</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- 🔹 HEADER -->
<header class="navbar">
  <div class="nav-left">
    <a href="home.html" class="logo">
      <span>Servly</span>
    </a>
  </div>

  <div class="nav-right">
    <button class="nav-btn secondary" onclick="window.location.href='home.html'">Home</button>
    <button id="profileBtn" class="nav-btn secondary" style="display:none;">Profile</button>
    <button class="nav-btn secondary" onclick="window.location.href='about.html'">About</button>
  </div>
</header>

<!-- 🔥 HERO -->
<section class="help-hero">
  <h1>Need Help?</h1>
  <p>We’re here to assist you. Tell us your issue and we’ll get back to you.</p>
</section>

<!-- 📩 FORM -->
<section class="help-section">
  <form id="helpForm">

    <label>Your Name</label>
    <input type="text" id="name" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Type of Issue</label>
    <select id="issue">
      <option>General Query</option>
      <option>Booking Problem</option>
      <option>Emergency Issue</option>
      <option>Payment Issue</option>
    </select>

    <label>Your Message</label>
    <textarea id="message" rows="5" required></textarea>

    <button type="submit" class="primary">Submit</button>

  </form>

  <p id="successMsg" style="display:none; color:green; margin-top:15px;">
    ✅ Your query has been submitted!
  </p>
</section>

<!-- 🔹 FOOTER -->
<footer>
  © 2026 Servly. Support that listens.
</footer>

<script src="js/help.js"></script>

</body>
</html>
